name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile_app/**'
      - 'src/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - 'src/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-11-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev build-essential ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.37 buildozer

      - name: Cache Buildozer global directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('mobile_app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build debug APK
        id: build_apk
        working-directory: mobile_app
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer-full.log

      - name: Show last build log lines on failure
        if: failure()
        working-directory: mobile_app
        run: |
          echo "===== Last 200 lines of buildozer-full.log ====="
          tail -n 200 buildozer-full.log || true
          echo "===== Matching error lines ====="
          grep -niE "error|exception|traceback|failed|stderr" buildozer-full.log | tail -n 100 || true
          echo "===== Gradle wrapper properties ====="
          find .buildozer -path "*/gradle/wrapper/gradle-wrapper.properties" -print -exec sed -n '1,120p' {} \; || true
          echo "===== Android build.gradle snippets ====="
          find .buildozer -path "*/build.gradle" -print -exec grep -nE "com.android.tools.build:gradle|compileSdkVersion|targetSdkVersion|minSdkVersion" {} \; || true
          echo "===== gradlew stacktrace rerun ====="
          GRADLE_DIR=$(find .buildozer -type f -name gradlew | head -n 1 | xargs -r dirname)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR"
            chmod +x gradlew || true
            ./gradlew clean assembleDebug --stacktrace --info || true
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            mobile_app/buildozer-full.log
            mobile_app/.buildozer/**/*.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile_app/bin/*.apk
          if-no-files-found: error
