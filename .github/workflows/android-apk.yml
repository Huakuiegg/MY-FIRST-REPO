name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile_app/**'
      - 'src/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - 'src/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/android-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev build-essential ccache
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.37 buildozer
      - name: Cache Buildozer global directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('mobile_app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-
      - name: Build debug APK
        working-directory: mobile_app
        run: |
          buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile_app/bin/*.apk
          if-no-files-found: error
